[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ds-qq"
version = "0.1.0"
description = "A persistent multimodal DeepSeek bot for QQ groups"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic-settings>=2.5,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
dsqq-bot = "ds_qq.bot:main"
dsqq-dashboard = "ds_qq.dashboard:main"

[dependency-groups]
dev = ["ruff>=0.8,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/ds_qq"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
